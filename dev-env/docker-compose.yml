name: backend-learning

services:
  postgres:
    image: postgres:17-alpine
    container_name: learn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: playground
    ports:
      - "${LEARN_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    # Phase 2 needs these: pg_stat_statements finds slow queries,
    # auto_explain captures plans without running EXPLAIN by hand.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=all
      - -c
      - auto_explain.log_min_duration=500ms
      - -c
      - auto_explain.log_analyze=on
      - -c
      - log_min_duration_statement=500ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d playground"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: learn-redis
    restart: unless-stopped
    ports:
      - "${LEARN_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: learn-kafka
    restart: unless-stopped
    ports:
      - "${LEARN_KAFKA_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Two listeners on purpose: PLAINTEXT for apps run on the host,
      # INTERNAL for anything added to this compose file later.
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single-node cluster: every replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Opt-in: docker compose --profile tools up -d
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: learn-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${LEARN_KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
